name: iVivid Linux beta build
on:
  push:
    branches: ["beta/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ivivid-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev mpv ffmpeg dpkg-dev xvfb xauth
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Test launcher quoting
        run: bash tests/launcher_tests.sh
      - name: Test generated mpv configuration
        run: |
          mkdir -p "$HOME/.config/iVivid"
          cat > "$HOME/.config/iVivid/mpv.conf" <<'EOF'
          hwdec=auto-safe
          scale=bilinear
          cscale=bilinear
          deband=yes
          saturation=10
          brightness=0
          contrast=0
          EOF
          mpv --no-config --include="$HOME/.config/iVivid/mpv.conf" --list-options > /dev/null
      - name: Decode synthetic video and audio with mpv
        run: bash tests/playback_smoke.sh
      - name: Build Debian package
        run: bash packaging/build-deb.sh
      - name: Install and smoke-test Debian package
        run: |
          sudo apt-get install -y ./dist/ivivid_1.1.7-beta.1_amd64.deb
          command -v iVivid
          command -v ivivid-play
          test -f /usr/share/applications/iVivid.desktop
          timeout 5s env QT_QPA_PLATFORM=offscreen iVivid > /tmp/ivivid-gui.log 2>&1 && code=0 || code=$?
          test "$code" -eq 124 || test "$code" -eq 0
          cat /tmp/ivivid-gui.log
          timeout 5s xvfb-run -a -s "-screen 0 1280x800x24" iVivid > /tmp/ivivid-xvfb.log 2>&1 && xcode=0 || xcode=$?
          test "$xcode" -eq 124 || test "$xcode" -eq 0
          cat /tmp/ivivid-xvfb.log
      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sha256sum dist/*.deb > dist/SHA256SUMS
      - name: Upload downloadable beta package
        uses: actions/upload-artifact@v4
        with:
          name: iVivid-ubuntu2404-amd64-beta
          path: dist/*
          if-no-files-found: error
      - name: Retry GitHub prerelease publication with GITHUB_TOKEN
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta/cpp-preview-0.2.0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v1.1.7-beta.1"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; not replacing immutable tested assets."
            exit 0
          fi
          if gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "iVivid v1.1.7-beta.1 — Linux test preview" \
            --notes "Ubuntu 24.04 amd64 test preview. Validated by CI: C++ tests, synthetic mpv video/audio decoding, package installation and virtual-display GUI startup. Hardware GPU/HDR behavior remains unverified."; then
            echo "Release published."
          else
            echo "::warning::GitHub denied release publication. Check Settings > Actions > General > Workflow permissions and select Read and write permissions; Actions artifact remains downloadable."
          fi
