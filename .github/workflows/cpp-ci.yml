name: iVivid Linux beta build
on:
  push:
    branches: ["beta/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev mpv ffmpeg dpkg-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure
      - name: Test launcher quoting
        run: bash tests/launcher_tests.sh
      - name: Test generated mpv configuration
        run: |
          mkdir -p "$HOME/.config/iVivid"
          cat > "$HOME/.config/iVivid/mpv.conf" <<'EOF'
          hwdec=auto-safe
          scale=bilinear
          cscale=bilinear
          deband=yes
          saturation=10
          brightness=0
          contrast=0
          EOF
          mpv --no-config --include="$HOME/.config/iVivid/mpv.conf" --list-options > /dev/null
      - name: Decode synthetic video and audio with mpv
        run: bash tests/playback_smoke.sh
      - name: Build Debian package
        run: bash packaging/build-deb.sh
      - name: Install and smoke-test Debian package
        run: |
          sudo apt-get install -y ./dist/ivivid_0.2.0-beta.4_amd64.deb
          command -v iVivid
          command -v ivivid-play
          test -f /usr/share/applications/iVivid.desktop
          timeout 5s env QT_QPA_PLATFORM=offscreen iVivid > /tmp/ivivid-gui.log 2>&1 && code=0 || code=$?
          test "$code" -eq 124 || test "$code" -eq 0
          cat /tmp/ivivid-gui.log
      - name: Inspect package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          sha256sum dist/*.deb > dist/SHA256SUMS
      - name: Upload downloadable beta package
        uses: actions/upload-artifact@v4
        with:
          name: iVivid-ubuntu2404-amd64-beta
          path: dist/*
          if-no-files-found: error
      - name: Publish prerelease assets (successful branch build only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/beta/cpp-preview-0.2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v0.2.0-beta.4"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; uploading rebuilt assets"
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --target "$GITHUB_SHA" --prerelease \
              --title "iVivid v0.2.0-beta.4 — Linux public test preview" \
              --notes "Experimental public beta for Ubuntu 24.04 amd64. Includes C++/Qt GUI, Video, Audio and Experimental tabs, isolated mpv settings, and ivivid-play launcher. Hardware compatibility is not yet fully verified. See README for installation and known limitations."
          fi
