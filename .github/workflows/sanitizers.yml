name: iVivid sanitizer verification
on:
  push:
    branches: ["beta/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ivivid-sanitizers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  address-undefined:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt and compiler
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake qt6-base-dev
      - name: Configure sanitizers
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build sanitized binaries
        run: cmake --build build-sanitized --parallel 2
      - name: Run sanitizer-backed unit tests
        run: ctest --test-dir build-sanitized --output-on-failure
